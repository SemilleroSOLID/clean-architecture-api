# Profile "test" (issue #24): the Spring context starts without SQL Server or RabbitMQ, so ./gradlew test needs no Docker.
# An in-memory H2 database is only used to check that the context loads; the tests against a real
# SQL Server are the integration tests (#25, Testcontainers).
# The entities use the schema dbo of SQL Server, which H2 does not have until it is created
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS dbo
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# RabbitMQ only connects when something is published; nothing is published while the context starts
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5673

# Test key, never used outside the tests
app.jwt.secret=dGVzdC1zZWNyZXQtb25seS1mb3ItdGhlLXVuaXQtdGVzdHMtMzI=
app.jwt.expiration-minutes=60
