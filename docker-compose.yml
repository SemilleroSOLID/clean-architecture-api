services:
  sqlserver:
    build:
      context: .
      dockerfile: sqlserver.Dockerfile
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "1435:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -d CleanArchitectureDB -Q \"SELECT 1 FROM ConvocationType\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

    networks:
      - mynetwork

  backend:
    build: ./
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      DB_HOST: sqlserver
      DB_PORT: 1433
      RABBITMQ_HOST: host.docker.internal
      RABBITMQ_PORT: 5673
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:3001"
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: bridge
