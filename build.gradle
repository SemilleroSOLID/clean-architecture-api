plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.5'
	id 'io.spring.dependency-management' version '1.1.4'
	id 'jacoco'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '17'
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-amqp'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'

	//JWT (issue #22)
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// Only for contextLoads in the "test" profile (issue #24)
	testRuntimeOnly 'com.h2database:h2'
	// Integration tests against a real SQL Server in Docker (issue #25)
	testImplementation 'org.testcontainers:junit-jupiter'

	//sql server
	runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc'

	//ORM
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'


}

tasks.named('test') {
	// Unit tests only: they need no Docker
	useJUnitPlatform {
		excludeTags 'integration'
	}
}

// Integration tests (issue #25): ./gradlew integrationTest  (needs Docker running)
tasks.register('integrationTest', Test) {
	description = 'Runs the integration tests against a real SQL Server started with Testcontainers.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'integration'
	}
	shouldRunAfter tasks.named('test')
}

// Coverage (issue #24): ./gradlew test jacocoTestReport -> build/reports/jacoco/test/html/index.html
jacoco {
	toolVersion = '0.8.12'
}

jacocoTestReport {
	dependsOn test
	reports {
		html.required = true
		xml.required = true
	}
	// Only the code with logic: JPA entities, configuration and the main class add nothing to the report
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: [
					'com/example/demo/Infrastructure/Persistence/Entities/**',
					'com/example/demo/ServiciosUcaldasLogicaNegocioApplication*'
			])
		}))
	}
}
